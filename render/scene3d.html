<body><div id="stage"></div>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { buildPuppet, posePuppet, loadPuppet, faceCamera, exprAt as exprAtP } from './lib/puppet.js';
import * as P from './lib/props.js';

const W=1080,H=1920,DUR=24.0;
// ?clean=1 -> no captions, no cut flash: plates for image-to-video hand-off
const CLEAN=location.search.indexOf('clean')>=0;
// ?captions=1 -> kinetic type only, on transparent, to overlay on generated clips
const CAPS=location.search.indexOf('captions')>=0;
const stage=document.getElementById('stage');
const clamp=(v,a=0,b=1)=>v<a?a:(v>b?b:v);
const pr=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,x)=>a+(b-a)*x;
const eOut=x=>1-Math.pow(1-x,3), eOut4=x=>1-Math.pow(1-x,4), eIn=x=>x*x*x;
const eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eBack=x=>{const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};

const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(W,H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.28;
stage.appendChild(renderer.domElement);
if(CAPS){renderer.domElement.style.display='none';
  document.documentElement.style.background='transparent';
  document.body.style.background='transparent';
  stage.style.background='transparent';}

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(32,W/H,0.1,400);
const SKY_DUSK=LK.duskSky(false), SKY_NIGHT=LK.duskSky(true);
scene.background=SKY_DUSK;
scene.fog=new THREE.Fog(0xCBAFD4,42,155);

const world=new THREE.Group(); scene.add(world);
const studio=new THREE.Group(); studio.visible=false; scene.add(studio);
const rig=LK.softRig(scene,false);

/* ---------------- ground ---------------- */
const groundTex=LK.cv(512,512,(g,w,h)=>{
  g.fillStyle='#9C86AC'; g.fillRect(0,0,w,h);
  let s=1234; const rnd=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};
  for(let row=0;row<9;row++)for(let col=-1;col<10;col++){
    const x=col*56+(row%2?28:0)+rnd()*5, y=row*57+rnd()*4;
    const l=150+rnd()*36;
    g.fillStyle='rgb('+(l+16)+','+(l-10)+','+(l+18)+')';
    g.beginPath(); g.roundRect(x,y,46+rnd()*8,40+rnd()*5,15); g.fill();
    g.fillStyle='rgba(255,240,225,0.12)';
    g.beginPath(); g.roundRect(x+4,y+3,38,16,10); g.fill();
  }
});
groundTex.wrapS=groundTex.wrapT=THREE.RepeatWrapping; groundTex.repeat.set(26,26);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),
  new THREE.MeshPhongMaterial({map:groundTex,shininess:10,specular:0x554455}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; world.add(ground);

/* ---------------- houses (soft silhouettes) ---------------- */
for(let i=0;i<6;i++){
  const z=4-i*8;
  for(const s of [-1,1]){
    const g=new THREE.Group(); g.position.set(s*(9.4+(i%2)*0.8),0,z+(s<0?1.4:0));
    const hh=5.6+((i*7)%3);
    const wall=new THREE.Mesh(new THREE.BoxGeometry(5.0,hh,4.6),
      new THREE.MeshPhongMaterial({color:0x7E6199,shininess:8,emissive:0x241c30}));
    wall.position.y=hh/2; wall.castShadow=true; wall.receiveShadow=true; g.add(wall);
    const roof=new THREE.Mesh(new THREE.ConeGeometry(4.2,hh*0.44,4),
      new THREE.MeshPhongMaterial({color:0x64497E,shininess:6,emissive:0x1e1728}));
    roof.position.y=hh+hh*0.22; roof.rotation.y=Math.PI/4; roof.castShadow=true; g.add(roof);
    for(let k=0;k<3;k++){
      const win=new THREE.Mesh(new THREE.PlaneGeometry(0.62,0.86),
        new THREE.MeshBasicMaterial({color:0xFFD79A,fog:false}));
      win.position.set(-1.2+k*1.2,hh*0.42+((k%2)*1.5),2.32); g.add(win);
      const gl=P.glowSprite(0xFFC98A,2.4,0.45); gl.position.copy(win.position); gl.position.z+=0.1; g.add(gl);
    }
    world.add(g);
  }
}

/* ---------------- pumpkins / lollipops ---------------- */
function softPumpkin(scale,opt){
  const p=P.pumpkin(scale,opt||{});
  LK.softenMaterials(p,26);
  p.traverse(o=>{if(o.isMesh)o.receiveShadow=true;});
  return p;
}
const streetPk=[];
[[-3.5,3.5,1.0],[3.4,4.6,0.85],[-3.4,-4,1.15],[3.5,-8,0.95],[-3.6,-13,1.05],[3.4,-17.5,0.9],
 [-3.4,-22,1.15],[3.7,-27,1.0]].forEach(function(p,i){
  const pk=softPumpkin(p[2],{light:i===2,lightPower:22});
  pk.position.x=p[0]; pk.position.z=p[1]; pk.rotation.y=(i*1.7)%1.2-0.6;
  world.add(pk); streetPk.push(pk);
});
[[-4.6,1.2,0],[6.6,-1.0,1],[-4.8,-9.5,1],[4.6,-14,0],[-4.7,-19,0],[4.8,-24,1]].forEach(function(l,i){
  const lp=LK.lollipop(l[2],1.5+ (i%3)*0.35);
  lp.position.set(l[0],0,l[1]); lp.rotation.y=(i*0.9)%1.4-0.7; world.add(lp);
});
const bigPk=softPumpkin(1.85,{light:true,lightPower:26});
bigPk.position.set(3.2,bigPk.position.y,-11.6); bigPk.rotation.y=-0.45; world.add(bigPk);
const heroPk=softPumpkin(2.2,{face:false,light:false});
const HERO_X=44.0, HERO_Z=-6.0, HERO_LIFT=7.5;
heroPk.position.set(HERO_X,heroPk.position.y+HERO_LIFT,HERO_Z); world.add(heroPk);
const HERO_TOP=2.2*1.60-0.18+HERO_LIFT;

/* arch */
const arch=new THREE.Group(); arch.position.set(0,0,-14.5); world.add(arch);
(function(){
  const vine=new THREE.Mesh(new THREE.TorusGeometry(4.6,0.20,8,44,Math.PI),
    new THREE.MeshPhongMaterial({color:0x6B4E7C,shininess:10,emissive:0x1d1526}));
  vine.position.y=0.1; arch.add(vine);
  for(let i=0;i<9;i++){
    const a=Math.PI*(0.06+0.88*i/8), s=0.34+0.16*Math.sin(i*1.3);
    const pk=softPumpkin(s,{light:false});
    pk.position.set(Math.cos(a)*4.6,0.1+Math.sin(a)*4.6,0);
    pk.rotation.z=a-Math.PI/2; arch.add(pk);
  }
  for(const s of [-1,1]) for(let k=0;k<3;k++){
    const pk=softPumpkin(0.62-k*0.10,{light:false});
    pk.position.set(s*4.6,pk.position.y+k*0.92,0.1); arch.add(pk);
  }
})();

/* porch */
const porch=new THREE.Group(); porch.position.set(6.6,0,-6.0); world.add(porch);
(function(){
  const wallM=new THREE.MeshPhongMaterial({color:0x8C6EA8,shininess:8,emissive:0x271f33});
  const w=new THREE.Mesh(new THREE.BoxGeometry(3.4,5.6,4.6),wallM);
  w.position.set(1.9,2.8,0); w.castShadow=true; w.receiveShadow=true; porch.add(w);
  const door=new THREE.Mesh(new THREE.BoxGeometry(0.22,3.1,1.7),
    new THREE.MeshPhongMaterial({color:0xB07A52,shininess:26,emissive:0x2a1c12}));
  door.position.set(0.22,1.9,0); porch.add(door);
  const lamp=new THREE.PointLight(0xFFCF9E,12,9,2); lamp.position.set(-0.1,3.6,0.9); porch.add(lamp);
  const lg=P.glowSprite(0xFFCF9E,2.2,0.75); lg.position.copy(lamp.position); porch.add(lg);
  const stepM=new THREE.MeshPhongMaterial({color:0x9E80B2,shininess:10,emissive:0x2a2233});
  for(let k=0;k<2;k++){
    const st=new THREE.Mesh(new THREE.BoxGeometry(1.1,0.34,3.2),stepM);
    st.position.set(-0.28-k*1.05,0.17+(1-k)*0.34,0);
    st.castShadow=true; st.receiveShadow=true; porch.add(st);
  }
  const p1=softPumpkin(0.5,{light:false}); p1.position.set(-0.5,p1.position.y+0.68,1.25); porch.add(p1);
  const p2=softPumpkin(0.38,{light:false}); p2.position.set(-0.55,p2.position.y+0.68,-1.25); porch.add(p2);
})();

/* candles */
const candles=[];
[[-2.15,-10.2,0.34],[-1.55,-9.55,0.26],[1.35,-10.6,0.30]].forEach(function(c,i){
  const g=new THREE.Group(); g.position.set(c[0],0,c[1]);
  const wax=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.15,c[2]*2.2,14),
    new THREE.MeshPhongMaterial({color:0xFBF1E2,shininess:30,emissive:0x2a2620}));
  wax.position.y=c[2]*1.1; wax.castShadow=true; g.add(wax);
  const fl=P.glowSprite(0xFFCB70,1.15,0.95); fl.position.y=c[2]*2.2+0.16; g.add(fl);
  const li=new THREE.PointLight(0xFFC078,5,4.5,2); li.position.y=c[2]*2.2+0.16; g.add(li);
  world.add(g); candles.push({fl:fl,li:li,ph:i*1.9});
});

/* ground candy + bokeh field */
(function(){
  let s=777; const rnd=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};
  for(let i=0;i<30;i++){
    const c=P.candy(i,0.11+rnd()*0.06);
    LK.softenMaterials(c,40);
    c.position.set((rnd()-0.5)*12,0.09,4-rnd()*30);
    c.rotation.set(rnd()*3,rnd()*3,rnd()*3); world.add(c);
  }
  for(let i=0;i<8;i++){
    const c=P.candy(i,0.10+rnd()*0.05); LK.softenMaterials(c,40);
    c.position.set(6.0-rnd()*1.4,0.44+(i%2)*0.34,-6.0+(rnd()-0.5)*2.4);
    c.rotation.set(rnd()*3,rnd()*3,rnd()*3); world.add(c);
  }
})();
const bokeh=LK.candyField(world,{n:26,cx:0,cy:2.4,cz:-6,spread:16,rise:9,seed:99});
const bokehHero=LK.candyField(world,{n:22,cx:HERO_X,cy:HERO_TOP+1.0,cz:HERO_Z+1,spread:13,rise:9,seed:404});

/* bats */
const bats=[];
for(let i=0;i<6;i++){
  const b=P.batSprite(1.3+(i%3)*0.45); b.material.opacity=0.75; world.add(b);
  bats.push({s:b,y:9+(i*3.1)%8,z:-10-(i*4.3)%18,ph:i*1.7,sp:2.0+(i%4)*0.5,x0:(i*7.3)%30-15});
}

/* landing dust */
const dustTex=LK.cv(512,256,(g)=>{
  let s=5; const rn=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};
  g.fillStyle='rgba(252,242,255,0.92)';
  for(let i=0;i<26;i++){
    const u=i/25, x=40+u*432, y=214-Math.pow(Math.sin(u*Math.PI),0.8)*118*(0.5+rn()*0.6);
    g.beginPath(); g.arc(x,y,16+rn()*40*Math.sin(u*Math.PI),0,7); g.fill();
  }
  g.globalCompositeOperation='destination-in';
  const gr=g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'rgba(0,0,0,0.10)'); gr.addColorStop(0.55,'rgba(0,0,0,0.95)');
  gr.addColorStop(1,'rgba(0,0,0,0.30)');
  g.fillStyle=gr; g.fillRect(0,0,512,256);
  const gx=g.createLinearGradient(0,0,512,0);
  gx.addColorStop(0,'rgba(0,0,0,0)'); gx.addColorStop(0.16,'rgba(0,0,0,1)');
  gx.addColorStop(0.84,'rgba(0,0,0,1)'); gx.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gx; g.fillRect(0,0,512,256);
  g.globalCompositeOperation='source-over';
});
const dust=[];
for(let i=0;i<3;i++){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(1,1),
    new THREE.MeshBasicMaterial({map:dustTex,transparent:true,depthWrite:false,fog:false,opacity:0}));
  m.visible=false; world.add(m); dust.push(m);
}

/* studio (product cut) */
(function(){
  const g=new THREE.Mesh(new THREE.PlaneGeometry(160,160),
    new THREE.MeshBasicMaterial({color:0xFFFFFF,fog:false}));
  g.rotation.x=-Math.PI/2; studio.add(g);
  const back=new THREE.Mesh(new THREE.PlaneGeometry(160,90),
    new THREE.MeshBasicMaterial({color:0xFFFFFF,fog:false}));
  back.position.set(0,45,-34); studio.add(back);
  const sh=P.glowSprite(0x9C8CBA,3.0,0.30);
  sh.material.blending=THREE.NormalBlending; sh.material.color.setHex(0x9C8CBA);
  sh.position.set(-1.285,0.03,1.2); sh.scale.set(1.0,0.32,1); studio.add(sh);
})();

/* ---------------- character + bottle ---------------- */
let char=null, heldBottle=null, propBottle=null, bottleGlow=null;
const ready=(async function(){
  const rigAssets=await loadPuppet();
  char=buildPuppet(rigAssets); scene.add(char);
  const labelTex=await new Promise(r=>new THREE.TextureLoader().load('/assets/build/label_hall.png',
    t=>{t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=16;r(t);}));
  const bEnv=bottleEnv(renderer,false);
  propBottle=new THREE.Group(); scene.add(propBottle);
  const pb=makeBottle(labelTex,bEnv,{envI:1.45});
  const bs=1.55/BOTTLE_H; pb.scale.setScalar(bs); pb.position.y=-1.55/2;
  propBottle.add(pb);
  bottleGlow=P.glowSprite(0xFFE1B0,3.6,0); bottleGlow.position.z=-0.30;
  bottleGlow.renderOrder=-1; propBottle.add(bottleGlow);
  buildUI();
  window.__DUR=DUR; window.render(0); window.__dbg={camera:camera,char:char,scene:scene}; window.__ready=true;
})();

/* ---------------- DOM overlay ---------------- */
let UI={};
function outline(r,c){let s=[];for(let i=0;i<20;i++){const a=i/20*6.283;
  s.push((Math.cos(a)*r).toFixed(1)+'px '+(Math.sin(a)*r).toFixed(1)+'px 0 '+c);}return s.join(',');}
function el(tag,css,parent,html,cls){const e=document.createElement(tag);if(cls)e.className=cls;
  e.style.cssText=css;if(html!=null)e.innerHTML=html;(parent||stage).appendChild(e);return e;}

      txl,'','tx');
    d.innerHTML=[...str].map(c=>'<span>'+(c===' '?'&nbsp;':c)+'</span>').join('');
    return {d:d,sp:[...d.querySelectorAll('span')]};
  }
  UI.t1=mk('ハロウィン、はじまるよ！',78,1520);
  UI.t2=mk('今夜だけの、おたのしみ。',74,300);
  UI.t4=mk('ん？なにこれ！',82,300);
  UI.t5=mk('なかみは、ないしょ。',74,1500);
  UI.t6=mk('トリック・オア・トリート！',70,300);
  UI.t7=mk('おつかれの脚に、ごほうびを。',64,1520);
  UI.t8=mk('正体は…？',96,1460);
  UI.vig=el('div','',stage,'','ov'); UI.vig.id='vig';

  const pc=el('div','opacity:0',stage,'','ov'); UI.pc=pc;
  UI.pcTop=el('div','position:absolute;left:0;top:196px;width:1080px;text-align:center',pc);
  el('div','position:absolute;left:50%;top:0;transform:translateX(-50%);padding:12px 34px;border-radius:999px;'+
    'background:linear-gradient(90deg,#FF8FC0,#B98BFF);color:#fff;font-weight:800;font-size:32px;'+
    'letter-spacing:.36em;text-indent:.36em;box-shadow:0 10px 24px rgba(185,139,255,.35)',UI.pcTop,'CHENME');
  UI.pcName=el('div','position:absolute;left:0;top:282px;width:1080px;text-align:center;font-weight:900;'+
    'font-size:96px;background:linear-gradient(92deg,#7BA7E8 0%,#B98BFF 46%,#FF8FC0 100%);'+
    '-webkit-background-clip:text;-webkit-text-fill-color:transparent;opacity:0',pc,'ほぐほぐクリーム');
  UI.pcTag=el('div','position:absolute;left:0;top:412px;width:1080px;text-align:center;font-weight:800;'+
    'font-size:40px;color:#8A7BA8;letter-spacing:.06em;opacity:0',pc,'今日より明日。もっとスッキリ。');
  UI.pcLine=el('div','position:absolute;left:50%;top:494px;width:0;height:4px;border-radius:2px;opacity:0;'+
    'background:linear-gradient(90deg,rgba(255,143,192,0),#FFA9CE,#C9A8FF,rgba(201,168,255,0))',pc);
  UI.pcFoot=el('div','position:absolute;left:0;top:1748px;width:1080px;text-align:center;font-weight:900;'+
    'font-size:46px;color:#6B5B86;letter-spacing:.10em;opacity:0',pc,'HAPPY HALLOWEEN');
  UI.fxB=el('canvas','position:absolute;left:0;top:0;width:1080px;height:1920px',pc);
  UI.fxB.width=1080; UI.fxB.height=1920; UI.gB=UI.fxB.getContext('2d');
  const BW=520, BH=BW*1193/583;
  UI.bwrap=el('div','position:absolute;left:'+((1080-BW)/2)+'px;top:589px;width:'+BW+'px;height:'+BH+'px;'+
    'transform-origin:50% 50%',pc);
  UI.bHall=el('img','position:absolute;left:0;top:0;width:'+BW+'px',UI.bwrap);
  UI.bHall.src='/assets/build/plate_hall3d.png';
  UI.bProd=el('img','position:absolute;left:0;top:0;width:'+BW+'px;opacity:0',UI.bwrap);
  UI.bProd.src='/assets/build/plate_prod.png';
  UI.fxF=el('canvas','position:absolute;left:0;top:0;width:1080px;height:1920px',pc);
  UI.fxF.width=1080; UI.fxF.height=1920; UI.gF=UI.fxF.getContext('2d');
  UI.flash=el('div','',stage,'','ov'); UI.flash.id='flash';

/* ---------------- shots ---------------- */
const SH=[
  {t0:0.00,t1:2.70},{t0:2.70,t1:5.40},{t0:5.40,t1:7.80},{t0:7.80,t1:10.20},{t0:10.20,t1:12.40},
  {t0:12.40,t1:14.80},{t0:14.80,t1:16.80},{t0:16.80,t1:19.40},{t0:19.40,t1:24.00}
];
function shotAt(t){for(let i=SH.length-1;i>=0;i--){if(t>=SH[i].t0)return i;}return 0;}
function setCam(px,py,pz,lx,ly,lz,fov){
  camera.position.set(px,py,pz); camera.lookAt(lx,ly,lz);
  if(fov&&Math.abs(camera.fov-fov)>0.01){camera.fov=fov;camera.updateProjectionMatrix();}
}

function updateWorld(t){
  for(const b of bats){ b.s.position.set(((b.x0+t*b.sp)%34)-17,b.y+Math.sin(t*1.7+b.ph)*1.0,b.z); }
  LK.driftCandy(bokeh,t); LK.driftCandy(bokehHero,t);
  for(let i=0;i<candles.length;i++){const c=candles[i];
    const f=0.82+0.18*Math.sin(t*11+c.ph)+0.08*Math.sin(t*23+c.ph*2);
    c.fl.material.opacity=f; c.fl.scale.setScalar(1.15*(0.9+f*0.2)); c.li.intensity=4.4*f;}
  for(let i=0;i<streetPk.length;i++){const g=streetPk[i].userData.glow;
    if(g) g.material.opacity=0.5+0.18*Math.sin(t*3.1+i);}
}

/* ------------------------------------------------------------------
   Animation, 2D puppet. charXform is the intent pose (pure function of
   t); the overlap layer below turns it into a character by making every
   soft part arrive late and ring. Depth is faked the 2D way: a limb
   swinging toward camera is drawn shorter.
   ------------------------------------------------------------------ */
function bounce(u,h){
  const A=0.22,B=0.84;
  if(u<A){ const k=u/A; return {y:0,sq:-0.24*k*k,air:0,land:0,p:0,u:u}; }
  if(u<B){ const p=(u-A)/(B-A);
    return {y:h*4*p*(1-p), sq:0.24*Math.abs(2*p-1)-0.02, air:1, land:0, p:p, u:u}; }
  const k=(u-B)/(1-B);
  return {y:0, sq:-0.30*Math.exp(-k*4.2)*Math.cos(k*9.0), air:0, land:1-k, p:1, u:u};
}
function hops(lt,t0,per,h){
  if(lt<t0) return {y:0,sq:0,air:0,land:0,n:-1,u:0,p:0};
  const n=Math.floor((lt-t0)/per), u=((lt-t0)%per)/per;
  const b=bounce(u,h); b.n=n; return b;
}
function bounceLimbs(o,b,amt){
  const u=b.u, air=b.air, k=amt==null?1:amt;
  let raise, splay, tuck;
  if(u<0.22){ const q=u/0.22; raise=lerp(0.16,-0.20,q); splay=lerp(0.08,0.30,q); tuck=lerp(1,0.86,q); }
  else if(air){ const p=b.p;
    raise=lerp(-0.20,2.05,clamp(p*3.0))*(p<0.75?1:lerp(1,0.80,(p-0.75)/0.25));
    splay=Math.sin(p*Math.PI)*0.42+0.08; tuck=1-Math.sin(p*Math.PI)*0.30; }
  else { const q=1-b.land; raise=lerp(1.55,0.16,eOut(q)); splay=lerp(0.48,0.08,eOut(q)); tuck=lerp(0.84,1,eOut(q)); }
  o.armL=-raise*k; o.armR=raise*k;
  o.legL=-splay*k*0.8; o.legR=splay*k*0.8;
  o.legLScale=o.legRScale=tuck;
}
// frontal run: legs trade foreshortening, arms trade places
function stepCycle(o,ph,amp,armAmp){
  const sn=Math.sin(ph), cs=-sn;
  o.legL=-0.08+sn*amp*0.35; o.legR=0.08+sn*amp*0.35;
  o.legLScale=1-0.22*Math.max(0,sn); o.legRScale=1-0.22*Math.max(0,cs);
  o.armL=-(0.30+armAmp*0.5)-cs*armAmp*0.6; o.armR=(0.30+armAmp*0.5)-sn*armAmp*0.6;
  o.armLScale=1-0.18*Math.max(0,cs); o.armRScale=1-0.18*Math.max(0,sn);
}

const EXPR_KEYS=[
  [[0.00,'jump'],[0.62,'stand'],[0.94,'cheer'],[2.10,'jump']],
  [[2.70,'wave'],[4.05,'cheer'],[5.10,'wave']],
  [[5.40,'sit']],
  [[7.80,'stand'],[8.18,'reach'],[9.55,'hold2']],
  [[10.20,'hold2'],[11.22,'shy']],
  [[12.40,'cheer'],[13.90,'jump']],
  [[14.80,'shy']],
  [[16.80,'hold2'],[17.18,'present']],
  [[19.40,'stand'],[20.90,'cheer'],[22.30,'stand']]
];
const LANDINGS=[
  {t:0.60,x:0.0,z:-8.0,p:1.00},{t:1.14,x:0.0,z:-8.0,p:0.42},
  {t:1.76,x:0.0,z:-8.0,p:0.38},{t:2.38,x:0.0,z:-8.0,p:0.34},
  {t:13.06,x:0.0,z:-14.4,p:0.70},{t:13.86,x:0.0,z:-14.4,p:0.70},{t:14.66,x:0.0,z:-14.4,p:0.62}
];

function charXform(t,si){
  const s=SH[si], u=clamp((t-s.t0)/(s.t1-s.t0)), lt=t-s.t0;
  const o={x:0,y:0,z:-8,ry:0,sq:0,lean:0,spine:0,head:0,headNod:0,tail:0,
           armL:0,armR:0,legL:0,legR:0,armLScale:1,armRScale:1,legLScale:1,legRScale:1,
           torsoBend:0,sc:1,poms:true,hideArms:false};
  const br=0.018*Math.sin(t*2.3+si);
  if(si===0){
    const fall=pr(lt,0.06,0.60), h=hops(lt,0.72,0.62,0.62);
    o.z=-8.0;
    o.y=(fall<1? 9.6*(1-fall*fall) : h.y);
    if(fall<1){ o.sq=0.22; o.armL=-2.10; o.armR=2.10; o.legL=-0.28; o.legR=0.30;
      o.legLScale=o.legRScale=0.86; o.spine=-0.04; o.head=0.06; }
    else if(lt<0.72){ const k=pr(lt,0.60,0.72);
      o.sq=-0.30*Math.exp(-k*3.6)*Math.cos(k*8.4);
      o.armR=lerp(1.90,0.18,eOut(k)); o.armL=-o.armR;
      o.legL=lerp(-0.50,-0.08,eOut(k)); o.legR=lerp(0.50,0.08,eOut(k));
      o.headNod=lerp(0.9,0,eOut(k)); }
    else { o.sq=h.sq; bounceLimbs(o,h,0.85); o.headNod=0.25*h.air;
      // cheer shake once she is up: fast small beats the overlap turns into pom swings
      const sh2=Math.sin((lt-0.72)*23.0)*0.22*clamp((lt-0.85)*2.2);
      o.armL-=sh2; o.armR+=sh2; }
    o.lean=-0.03+0.03*Math.sin(Math.max(0,lt-0.7)*3.0);
  } else if(si===1){
    const e=eIO(u), run=lt*7.2;
    o.x=lerp(0.85,-0.20,e)+Math.sin(run*0.5)*0.08;
    o.z=lerp(-19.4,-9.0,e);
    o.y=Math.abs(Math.sin(run))*0.24;
    o.sq=-0.11*Math.pow(Math.abs(Math.cos(run)),3)+0.07*Math.abs(Math.sin(run));
    stepCycle(o,run,0.62,0.55);
    o.lean=-0.05+0.05*Math.sin(run*0.5); o.spine=0.05*Math.sin(run*2);
    o.head=-0.04+0.05*Math.sin(run*2+0.8); o.headNod=0.15+0.12*Math.sin(run*2);
    o.ry=0.05;
  } else if(si===2){
    o.x=-0.62; o.z=-11.9; o.ry=0.40;
    const b=Math.sin(lt*1.5), b2=Math.sin(lt*2.9+1.1);
    o.y=-0.42; o.legL=-1.16-0.05*b; o.legR=1.22+0.05*b; o.legLScale=o.legRScale=0.80;
    o.armL=-0.52-0.10*b2; o.armR=0.50+0.10*b2;
    o.spine=-0.06+0.05*b; o.head=0.10+0.07*b2; o.headNod=0.15+0.10*b;
    o.sq=-0.03+0.04*Math.sin(lt*2.2)+br;
  } else if(si===3){
    o.poms=false;
    const walk=pr(lt,0.00,0.78), e=eIO(walk);
    o.x=lerp(6.05,5.44,e); o.z=lerp(-8.35,-7.45,e); o.ry=-0.24;
    if(walk<1){ const ph=lt*7.6; stepCycle(o,ph,0.42,0.30);
      o.y=Math.abs(Math.sin(ph))*0.10; o.lean=-0.10; }
    else { const l2=lt-0.78;
      const dt1=pr(l2,0.00,0.20), dt2=pr(l2,0.20,0.48);
      const rch=eOut(pr(l2,0.42,1.05))*(1-pr(l2,1.55,1.95));
      o.y=Math.abs(Math.sin(l2*2.0))*0.04;
      o.lean=-0.08-0.10*dt1+0.20*dt2; o.spine=0.05+0.22*dt2;
      o.head=0.18*dt1-0.30*dt2+0.05*Math.sin(l2*1.9); o.headNod=-0.3*dt1+0.5*dt2;
      o.armR=lerp(0.16,1.34,rch); o.armL=lerp(-0.16,-0.42,rch);
      o.legL=-0.10; o.legR=0.12; o.torsoBend=0.09*dt2; o.sq=br; }
  } else if(si===4){
    o.x=4.86; o.z=-6.78; o.ry=-0.20; o.poms=false;
    const b=Math.sin(lt*1.7), b2=Math.sin(lt*2.4+0.7);
    o.y=0.02+0.04*Math.abs(Math.sin(lt*2.2));
    o.sq=-0.02+0.04*Math.sin(lt*2.2)+br;
    o.armR=1.16+0.09*b2; o.armL=-0.60-0.08*b;
    o.legL=-0.08-0.03*b; o.legR=0.10+0.03*b;
    o.spine=0.06+0.05*b; o.head=-0.10+0.07*b2; o.headNod=0.2+0.1*b;
    o.lean=-0.05+0.04*b;
  } else if(si===5){
    const h=hops(lt,0.10,0.80,1.95);
    o.x=Math.sin(lt*1.4)*0.22; o.z=-14.4; o.ry=0.02+0.10*Math.sin(lt*1.4);
    o.y=h.y; o.sq=h.sq;
    bounceLimbs(o,h,1.15);
    const sh3=Math.sin(lt*21.0)*0.24;
    o.armL-=sh3; o.armR+=sh3;
    o.headNod=0.25*h.air; o.lean=-0.05+0.06*Math.sin(lt*2.6);
  } else if(si===6){
    const b=Math.sin(lt*1.35), b2=Math.sin(lt*2.1+0.6);
    const h=hops(lt,1.05,0.44,0.30);
    o.x=0.02+0.10*b; o.z=-13.2; o.ry=0.10+0.07*Math.sin(lt*0.9);
    o.y=(lt>1.05&&lt<1.49?h.y:0)+0.03*Math.abs(Math.sin(lt*2.0));
    o.hideArms=true; o.poms=false;
    o.legL=-0.12-0.05*b; o.legR=0.14+0.05*b;
    o.spine=-0.05+0.06*b; o.head=-0.09+0.08*b2; o.headNod=0.25+0.15*b;
    o.lean=-0.07+0.05*b; o.sq=-0.04+0.05*Math.sin(lt*2.0)+br;
  } else if(si===7){
    const anti=pr(lt,0.14,0.36), rise=eBack(pr(lt,0.36,1.10));
    const set=1-pr(lt,1.10,1.55), b=Math.sin(lt*1.8);
    o.x=HERO_X-0.62; o.z=HERO_Z+0.55; o.ry=0.04; o.poms=false;
    o.y=HERO_TOP+0.04*Math.abs(Math.sin(lt*2.0));
    o.sq=-0.18*anti*(1-rise)+0.14*rise*set+br;
    o.armR=lerp(0.14,2.30,rise)-0.26*anti*(1-rise);
    o.armL=lerp(-0.10,-0.66,rise)-0.08*b;
    o.legL=-0.10-0.04*b; o.legR=0.12+0.04*b;
    o.spine=0.10*anti-0.10*rise+0.04*b;
    o.head=0.14*anti-0.12*rise+0.05*b; o.headNod=0.6*anti-0.35*rise;
    o.lean=-0.04+0.04*b;
  } else {
    const app=pr(t,20.05,20.75), idle=Math.max(0,t-19.9);
    const b=Math.sin(idle*1.8);
    o.x=lerp(-2.34,-1.285,eBack(app)); o.z=1.2; o.ry=0.24;
    o.y=0.02*Math.abs(Math.sin(idle*2.2));
    o.sq=-0.02+0.03*Math.sin(idle*2.2)+br;
    const wv=(t>20.90&&t<22.30)?1:0;
    const sh4=wv*Math.sin(idle*19.0)*0.22;
    o.armR=lerp(0.16,2.10,wv)+sh4; o.armL=lerp(-0.16,-1.60,wv)-sh4*0.8;
    o.legL=-0.08; o.legR=0.09;
    o.spine=0.04*b; o.head=-0.05+0.06*b; o.headNod=0.15+0.1*b;
    o.sc=0.28;
  }
  return o;
}

/* ---- overlap layer: pure functions of t, so any frame stands alone ---- */
const NS=15, WIN=0.46;
function makeOverlap(t,si,t0){
  const dt=WIN/(NS-1), S=[];
  for(let i=0;i<NS;i++) S.push(charXform(Math.max(t0,t-i*dt),si));
  return {
    S:S, dt:dt,
    drag:function(k,tc){
      const h=Math.max(this.dt*0.5,tc); let a=0,w=0;
      for(let i=0;i<NS;i++){ const e=Math.exp(-(i*this.dt)/h); a+=S[i][k]*e; w+=e; }
      return a/w;
    },
    vel:function(k){ return (S[0][k]-S[2][k])/(2*this.dt); },
    acc:function(k){ return (S[0][k]-2*S[1][k]+S[2][k])/(this.dt*this.dt); },
    ring:function(k,freq,damp,gain,lim){
      let a=0;
      for(let i=1;i<NS-1;i++){
        const tau=i*this.dt;
        const a2=(S[i-1][k]-2*S[i][k]+S[i+1][k])/(this.dt*this.dt);
        a+=a2*Math.exp(-damp*tau)*Math.sin(freq*tau)*this.dt;
      }
      a*=gain; const L=lim==null?0.5:lim;
      return a<-L?-L:(a>L?L:a);
    }
  };
}
const cl2=(v,l)=>v<-l?-l:(v>l?l:v);

function animChar(t,si){
  const s=SH[si];
  const O=makeOverlap(t,si,s.t0);
  const c=O.S[0];
  const vx=O.vel('x'), ax=O.acc('x'), ay=O.acc('y'), vry=O.vel('ry');

  const spine = O.drag('spine',0.035)+cl2(-ax*0.0016,0.14)+O.ring('x',34,11,0.00055,0.10);
  const lean  = O.drag('lean',0.03)+cl2(-ax*0.0022,0.13);
  const headZ = O.drag('head',0.085)+cl2(-ax*0.0022,0.17)+O.ring('x',26,9,0.0011,0.16);
  const headNod = O.drag('headNod',0.085)+cl2(-ay*0.0012,0.35)+O.ring('y',24,8.5,0.0008,0.30);
  const tailZ = O.drag('tail',0.175)+cl2(-vry*0.50-vx*0.075,0.85)
                +O.ring('x',17,5.2,0.0044,0.62)+O.ring('head',15,5.0,0.30,0.35)
                +O.ring('y',16,5.0,0.0030,0.40)
                +0.10*Math.sin(t*3.1)+0.05*Math.sin(t*5.3+1.2);

  const armL=O.drag('armL',0.045), armR=O.drag('armR',0.045);
  const armLBend=O.ring('armL',22,8,0.030,0.14), armRBend=O.ring('armR',22,8,0.030,0.14);
  const legLBend=O.ring('legL',22,8,0.026,0.12), legRBend=O.ring('legR',22,8,0.026,0.12);

  const pomL=O.ring('armL',15,4.6,0.075,0.80)+O.ring('y',14,4.4,0.0055,0.55)+0.06*Math.sin(t*4.1);
  const pomR=O.ring('armR',15,4.6,0.075,0.80)-O.ring('y',14,4.4,0.0055,0.55)+0.06*Math.sin(t*4.1+2);

  const sq=c.sq+cl2(-ay*0.0050,0.16)+O.ring('y',30,10,0.0016,0.10);

  posePuppet(char,{
    expr:exprAtP(t,EXPR_KEYS[si]),
    squash:sq, lean:lean, spine:spine, head:headZ, headNod:headNod, tail:tailZ,
    armL:armL, armR:armR,
    armLScale:O.drag('armLScale',0.04), armRScale:O.drag('armRScale',0.04),
    legL:O.drag('legL',0.03), legR:O.drag('legR',0.03),
    legLScale:O.drag('legLScale',0.03), legRScale:O.drag('legRScale',0.03),
    torsoBend:c.torsoBend+cl2(c.lean*0.35-vx*0.012,0.16),
    armLBend:armLBend, armRBend:armRBend, legLBend:legLBend, legRBend:legRBend,
    tailBend:tailZ*0.20,
    hideArms:c.hideArms, poms:c.poms!==false, pomL:pomL, pomR:pomR,
    by:0, bx:0
  });

  char.position.set(c.x,c.y,c.z);
  char.rotation.y=c.ry;
  char.scale.setScalar(c.sc);
  rig.key.position.set(c.x-4.5,c.y+9,c.z+8);
  rig.key.target.position.set(c.x,c.y+1.6,c.z);
  rig.key.target.updateMatrixWorld();
}

function updateDust(t){
  let k=0;
  for(const L of LANDINGS){
    const d=t-L.t;
    if(d<0||d>0.58||k>=dust.length) continue;
    const m=dust[k++], u=d/0.58;
    const sc=lerp(0.9,4.4,eOut(u))*L.p;
    m.visible=true;
    m.position.set(L.x,sc*0.20,L.z+0.12);
    m.rotation.y=Math.atan2(camera.position.x-L.x,camera.position.z-L.z);
    m.scale.set(sc*1.55,sc*0.80,1);
    m.material.opacity=Math.pow(1-u,2.0)*0.85*L.p;
  }
  for(;k<dust.length;k++) dust[k].visible=false;
}
function camShake(t){
  let a=0;
  for(const L of LANDINGS){ const d=t-L.t;
    if(d>=0&&d<0.30) a=Math.max(a,L.p*Math.pow(1-d/0.30,1.8)); }
  if(a<=0.001) return;
  camera.position.y+=Math.sin(t*78)*0.075*a;
  camera.position.x+=Math.sin(t*61+1.3)*0.048*a;
  camera.updateMatrixWorld();
}
// orbit the camera around a point: ang 0 = straight in front (+z side)
function orb(cx,cy,cz,rad,ang,camY,lookY,fov){
  setCam(cx+Math.sin(ang)*rad, camY, cz+Math.cos(ang)*rad, cx, lookY, cz, fov);
}
function camAt(t,si){
  const s=SH[si], u=clamp((t-s.t0)/(s.t1-s.t0)), e=eIO(u), lt=t-s.t0;
  switch(si){
    // drop-in: swing round to the front as she lands
    case 0: orb(0,0,-8.0, lerp(10.6,9.2,e), lerp(-0.34,0.00,e),
                lerp(2.7,2.15,e), lerp(2.2,1.85,e), 34); break;
    // run at camera, drifting off the axis
    case 1: setCam(lerp(0.8,-1.7,e),lerp(3.8,2.8,e),lerp(5.2,1.6,e),
                   0,lerp(2.0,2.2,e),lerp(-13,-8,e), 34); break;
    // sitting by the pumpkin: a full 65 degree arc round her
    case 2: orb(-0.60,0,-11.9, lerp(9.6,8.2,e), lerp(-0.50,0.22,eIO(u)),
                lerp(2.7,2.05,e), lerp(1.25,1.05,e), 33); break;
    // doorstep, arcing in
    case 3: orb(5.44,0,-7.45, lerp(9.8,8.0,e), lerp(-0.62,-0.30,e),
                lerp(3.4,2.7,e), lerp(1.60,1.40,e), 36); break;
    // the mystery bottle, orbiting the pair
    case 4: orb(5.10,0,-6.30, lerp(8.2,7.1,e), lerp(-0.55,-0.12,eIO(u)),
                lerp(2.6,2.25,e), lerp(1.55,1.42,e), 37); break;
    // trick or treat, low and swinging
    case 5: orb(0,0,-14.4, lerp(11.2,9.8,e), lerp(0.30,-0.26,eIO(u)),
                lerp(2.2,3.0,e), lerp(2.6,2.5,e), 35); break;
    // bashful close-up, slow drift round
    case 6: orb(0.02,0,-13.2, lerp(7.4,6.6,e), lerp(0.34,-0.14,eIO(u)),
                lerp(2.6,2.35,e), lerp(1.95,1.85,e), 32); break;
    // hero: a 75 degree sweep round her as the bottle comes up
    case 7: orb(HERO_X-0.30,0,HERO_Z+0.30, lerp(8.6,7.4,eIO(u)),
                lerp(-0.42,0.42,eIO(u)),
                HERO_TOP+lerp(0.50,1.30,e), HERO_TOP+lerp(0.95,1.25,e), 32); break;
    default: setCam(0,2.6,9.0, 0,2.3,0, 42); break;
  }
}

function updateBottle(t,si){
  if(!propBottle) return;
  const on=(si===3||si===4||si===7);
  propBottle.visible=on;
  if(si===7){
    const rise=eOut4(pr(t,17.15,18.25));
    // the "present" pose holds an open hand up: put the bottle in it
    const hp=new THREE.Vector3(); char.userData.hands[0].getWorldPosition(hp);
    propBottle.position.set(lerp(hp.x+0.9,hp.x,rise),
                            lerp(hp.y-1.5,hp.y+0.42,rise)+Math.sin(t*1.5)*0.03,
                            hp.z+0.12);
    propBottle.scale.setScalar(lerp(0.55,0.92,rise));
    propBottle.rotation.set(0,Math.atan2(camera.position.x-propBottle.position.x,
                                         camera.position.z-propBottle.position.z),
                            lerp(0.34,-0.05,rise));
    const g=rise*(0.22+0.10*Math.sin(t*3.4))+pr(t,18.60,19.15)*1.5;
    bottleGlow.material.opacity=clamp(g); bottleGlow.scale.setScalar(3.6*(0.8+g));
    return;
  }
  propBottle.scale.setScalar(si===4?lerp(1.0,1.22,eIO(pr(t,10.25,11.60))):1);
  if(on){
    propBottle.position.set(5.22,1.38+Math.sin(t*1.4)*0.03,-5.15);
    propBottle.rotation.set(0,Math.atan2(camera.position.x-5.22,camera.position.z+5.15)
                              +0.10*Math.sin(t*0.7),0);
    const g=0.16+0.08*Math.sin(t*3.2)+(si===4?0.14*pr(t,10.9,12.2):0);
    bottleGlow.material.opacity=g; bottleGlow.scale.setScalar(3.6*(0.8+g));
  }
}

function beat(o,a,b,c,d,t){
  const inn=pr(t,a,b), out=pr(t,c,d);
  o.d.style.opacity=(inn*(1-out)).toFixed(3);
  o.sp.forEach(function(s,i){
    const q=pr(t,a+i*0.024,a+i*0.024+0.30);
    s.style.transform='translateY('+lerp(48,0,eBack(q)).toFixed(1)+'px) scale('+lerp(0.35,1,eBack(q)).toFixed(3)+
      ') rotate('+lerp(-11,0,eBack(q)).toFixed(2)+'deg)';
  });
  o.d.style.transform='scale('+lerp(1,1.12,eIn(out)).toFixed(3)+')';
}
function reveal(t){
  const sw=t>=RV.T.swap?1:0;
  UI.bProd.style.opacity=sw; UI.bHall.style.opacity=1-sw;
  // the mystery bottle breathes, then the product lands and settles
  const fl=Math.sin(t*1.9)*0.006;
  const pop=lerp(1.10,1.0,eOut(clamp((t-RV.T.swap)/0.55)));
  const sc=t<RV.T.swap ? lerp(1.055,1.0,eIO(pr(t,19.30,20.10)))+fl : pop;
  UI.bwrap.style.transform='scale('+sc.toFixed(4)+')';
  RV.drawBack(UI.gB,t); RV.drawFront(UI.gF,t);
}
function updateUI(t){
  if(CAPS){
    beat(UI.t1,0.75,1.35,2.35,2.62,t); beat(UI.t2,3.10,3.70,5.05,5.32,t);
    beat(UI.t4,8.35,8.95,9.85,10.12,t); beat(UI.t5,10.75,11.35,12.05,12.32,t);
    beat(UI.t6,12.95,13.55,14.45,14.72,t); beat(UI.t7,15.10,15.70,16.45,16.72,t);
    beat(UI.t8,17.55,18.10,18.85,19.05,t);
    UI.vig.style.opacity=0; UI.flash.style.opacity=0; UI.pc.style.opacity=0;
    return;
  }
  if(CLEAN){
    for(const k of ['t1','t2','t4','t5','t6','t7','t8']) UI[k].d.style.opacity=0;
    UI.vig.style.opacity=0; UI.flash.style.opacity=0;
    UI.pc.style.opacity=pr(t,19.22,19.52).toFixed(3);
    reveal(t);
    UI.pcTop.style.opacity=0; UI.pcName.style.opacity=0; UI.pcTag.style.opacity=0;
    UI.pcLine.style.opacity=0; UI.pcFoot.style.opacity=0;
    return;
  }
  beat(UI.t1,0.75,1.35,2.35,2.62,t);
  beat(UI.t2,3.10,3.70,5.05,5.32,t);
  beat(UI.t4,8.35,8.95,9.85,10.12,t);
  beat(UI.t5,10.75,11.35,12.05,12.32,t);
  beat(UI.t6,12.95,13.55,14.45,14.72,t);
  beat(UI.t7,15.10,15.70,16.45,16.72,t);
  beat(UI.t8,17.55,18.10,18.85,19.05,t);
  UI.vig.style.opacity=(1-pr(t,18.85,19.30)).toFixed(3);
  UI.pc.style.opacity=pr(t,19.22,19.52).toFixed(3);
  reveal(t);
  UI.pcTop.style.opacity=pr(t,20.72,21.22).toFixed(3);
  UI.pcTop.style.transform='translateY('+lerp(-24,0,eOut(pr(t,20.72,21.32))).toFixed(1)+'px)';
  UI.pcName.style.opacity=pr(t,20.88,21.38).toFixed(3);
  UI.pcName.style.transform='translateY('+lerp(30,0,eOut(pr(t,20.88,21.48))).toFixed(1)+'px)';
  UI.pcTag.style.opacity=pr(t,21.30,21.80).toFixed(3);
  UI.pcTag.style.transform='translateY('+lerp(20,0,eOut(pr(t,21.30,21.90))).toFixed(1)+'px)';
  const lw=lerp(0,520,eOut(pr(t,21.45,22.05)));
  UI.pcLine.style.width=lw.toFixed(0)+'px'; UI.pcLine.style.marginLeft=(-lw/2).toFixed(0)+'px';
  UI.pcLine.style.opacity=pr(t,21.45,21.85).toFixed(3);
  UI.pcFoot.style.opacity=pr(t,22.00,22.55).toFixed(3);
  UI.pcFoot.style.transform='translateY('+lerp(18,0,eOut(pr(t,22.00,22.65))).toFixed(1)+'px)';
  let fl=1-pr(t,0.0,0.32);
  for(const s of SH){ if(s.t0>0.01) fl=Math.max(fl,(1-Math.abs(t-s.t0)/0.13)*0.8); }
  fl=Math.max(fl,pr(t,18.90,19.22)*(1-pr(t,19.30,19.75)));
  fl=Math.max(fl,(t>=20.195?1:0)*(1-pr(t,20.20,20.40))*0.80);
  UI.flash.style.opacity=clamp(fl).toFixed(3);
}

window.render=function(t){
  t=Math.max(0,Math.min(DUR,t));
  const si=shotAt(t), product=si===8;
  world.visible=!product; studio.visible=product;
  ground.visible=!product && si!==7;
  const night=(si===1||si===5||si===6);
  if(product){
    scene.background=new THREE.Color(0xFFFFFF); scene.fog=null;
    rig.amb.intensity=0.95; rig.hemi.intensity=1.05; rig.hemi.color.setHex(0xFFFFFF);
    rig.hemi.groundColor.setHex(0xF4EEFF);
    rig.key.color.setHex(0xFFF6EC); rig.key.intensity=0.95;
    rig.rim.intensity=0.25; rig.fill.intensity=0.35;
    if(renderer.toneMapping!==THREE.NoToneMapping){
      renderer.toneMapping=THREE.NoToneMapping;
      scene.traverse(o=>{if(o.material)o.material.needsUpdate=true;});
    }
  } else {
    scene.background=night?SKY_NIGHT:SKY_DUSK;
    scene.fog=scene.fog||new THREE.Fog(0xCBAFD4,42,155);
    scene.fog.color.setHex(night?0xA98BC0:0xCBAFD4);
    rig.amb.intensity=night?0.44:0.55; rig.hemi.intensity=night?0.74:0.95;
    rig.hemi.color.setHex(0xCDBBF0); rig.hemi.groundColor.setHex(0xF7D4B4);
    rig.key.color.setHex(0xFFE8CE); rig.key.intensity=night?1.08:1.30;
    rig.rim.intensity=1.00; rig.fill.intensity=0.55;
    if(renderer.toneMapping!==THREE.ACESFilmicToneMapping){
      renderer.toneMapping=THREE.ACESFilmicToneMapping;
      scene.traverse(o=>{if(o.material)o.material.needsUpdate=true;});
    }
    renderer.toneMappingExposure=1.28;
  }
  if(!CAPS){ updateWorld(t); updateDust(t); animChar(t,si); camAt(t,si); camShake(t);
             faceCamera(char,camera); updateBottle(t,si); renderer.render(scene,camera); }
  updateUI(t);
};
</script></body></html>
