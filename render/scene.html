<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ChenMe Halloween Promo — Frame Renderer</title>
<style>
@font-face{font-family:MPR;src:url('../assets/fonts/MPLUSRounded1c-Bold.ttf') format('truetype');font-weight:700;font-display:block}
@font-face{font-family:MPR;src:url('../assets/fonts/MPLUSRounded1c-ExtraBold.ttf') format('truetype');font-weight:800;font-display:block}
@font-face{font-family:MPR;src:url('../assets/fonts/MPLUSRounded1c-Black.ttf') format('truetype');font-weight:900;font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;
  font-family:MPR,"Noto Sans CJK JP",sans-serif;background:#000;
  -webkit-font-smoothing:antialiased}
.sc{position:absolute;inset:0;overflow:hidden;will-change:transform,opacity}
.lay{position:absolute;inset:0}
.abs{position:absolute}
img{display:block}
.ch{position:absolute;transform-origin:50% 88%}
#grain{position:absolute;inset:-100px;pointer-events:none;opacity:.05;mix-blend-mode:overlay}
#vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 78% 62% at 50% 46%,rgba(0,0,0,0) 40%,rgba(0,0,0,.30) 78%,rgba(0,0,0,.62) 100%)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#letter{position:absolute;inset:0;pointer-events:none}
.tx{position:absolute;white-space:nowrap;font-weight:900;color:#fff;transform-origin:50% 50%}
.tx span{display:inline-block;transform-origin:50% 100%}
</style>
</head>
<body>
<div id="stage"></div>
<script>
/* ============================================================
   ChenMe × Halloween  ―  15-30s vertical promo (1080x1920 @30fps)
   Deterministic renderer: window.render(t) fully defines a frame.
   Character art & product package are composited as untouched
   source pixels (uniform transform only) — never regenerated.
   ============================================================ */
const W=1080,H=1920;
const A={
  ch:'../assets/build/character.png',
  hall:'../assets/build/bottle_halloween_cut.png',
  prod:'../assets/build/bottle_product.png'
};
const CHW=1194, CHH=1209;              // character native size
const DUR=24.0;
const S1=[0,4.60], S2=[4.60,9.20], S3=[9.20,16.20], S4=[16.20,19.60], S5=[19.60,24.00];

/* ---------- math ---------- */
const clamp=(v,a=0,b=1)=>v<a?a:(v>b?b:v);
const pr=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,x)=>a+(b-a)*x;
const eOut=x=>1-Math.pow(1-x,3);
const eOut4=x=>1-Math.pow(1-x,4);
const eIn=x=>x*x*x;
const eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eBack=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const eElas=x=>x<=0?0:x>=1?1:Math.pow(2,-9*x)*Math.sin((x*10-.75)*(2*Math.PI/3))+1;
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------- dom ---------- */
const stage=document.getElementById('stage');
function el(tag,cls,css,parent,html){const e=document.createElement(tag);if(cls)e.className=cls;
  if(css)e.style.cssText=css;if(html!=null)e.innerHTML=html;(parent||stage).appendChild(e);return e;}
function svg(vb,inner,css,parent,cls){
  return el('div',cls||'abs',css,parent,'<svg viewBox="'+vb+'" width="100%" height="100%" style="display:block;overflow:visible">'+inner+'</svg>');}
function outline(r,c){let s=[];for(let i=0;i<20;i++){const a=i/20*Math.PI*2;
  s.push((Math.cos(a)*r).toFixed(1)+'px '+(Math.sin(a)*r).toFixed(1)+'px 0 '+c);}return s.join(',');}

/* ---------- art primitives ---------- */
function pumpkinSVG(face,glow){
  const g=glow||'#FFD24A';
  return '<defs><linearGradient id="pg'+face+'" x1="0" y1="0" x2="0" y2="1">'+
   '<stop offset="0" stop-color="#FFA83C"/><stop offset="1" stop-color="#E2711A"/></linearGradient></defs>'+
   '<path d="M60 16c-3-9 3-14 12-16 -4 8 2 10 4 16z" fill="#6B4A22"/>'+
   '<ellipse cx="30" cy="62" rx="27" ry="36" fill="#DB6C17"/>'+
   '<ellipse cx="90" cy="62" rx="27" ry="36" fill="#DB6C17"/>'+
   '<ellipse cx="44" cy="62" rx="30" ry="39" fill="#EE8620"/>'+
   '<ellipse cx="76" cy="62" rx="30" ry="39" fill="#EE8620"/>'+
   '<ellipse cx="60" cy="62" rx="34" ry="40" fill="url(#pg'+face+')"/>'+
   '<ellipse cx="46" cy="44" rx="9" ry="14" fill="#FFC06B" opacity=".45" transform="rotate(-18 46 44)"/>'+
   (face? '<g fill="'+g+'"><path d="M44 52l12 10-14 4z"/><path d="M76 52l-12 10 14 4z"/>'+
     '<path d="M60 62l6 9h-12z"/>'+
     '<path d="M38 76l8 6 6-5 7 6 7-6 6 5 8-6 -2 10-9 5h-20l-9-5z"/></g>' : '')+
   '';
}
function batSVG(c){c=c||'#1B0F2E';
  return '<path fill="'+c+'" d="M50 30c-6-12-16-16-24-13 3 4 3 9 1 12-6-7-16-8-22-3 7 0 11 5 12 11 4-3 9-2 12 1 5-5 12-6 21-1 9-5 16-4 21 1 3-3 8-4 12-1 1-6 5-11 12-11-6-5-16-4-22 3-2-3-2-8 1-12-8-3-18 1-24 13z"/>';
}
function ghostSVG(){return '<path fill="#F6EDFF" d="M50 6c22 0 34 16 34 38v40c0 6-6 8-10 4l-6-6-7 7c-3 3-7 3-10 0l-6-6-6 6c-3 3-7 3-10 0l-7-7-6 6c-4 4-10 2-10-4V44C16 22 28 6 50 6z"/>'+
  '<ellipse cx="38" cy="42" rx="5" ry="7" fill="#3B2456"/><ellipse cx="62" cy="42" rx="5" ry="7" fill="#3B2456"/>'+
  '<ellipse cx="50" cy="56" rx="7" ry="5" fill="#3B2456" opacity=".8"/>';}
function catSVG(){return '<path fill="#241436" d="M28 44l-6-22 16 10c8-4 16-4 24 0l16-10-6 22c6 8 8 18 8 30 0 10-8 16-30 16S20 84 20 74c0-12 2-22 8-30z"/>'+
  '<path fill="#241436" d="M78 84c14 4 18 14 14 22-2 4-8 2-7-2 2-8-4-12-12-14z"/>'+
  '<ellipse cx="41" cy="56" rx="5" ry="6" fill="#FFD24A"/><ellipse cx="61" cy="56" rx="5" ry="6" fill="#FFD24A"/>';}
function sparkSVG(c){c=c||'#FFF3C4';
  return '<path fill="'+c+'" d="M50 0c4 30 16 46 50 50-34 4-46 20-50 50-4-30-16-46-50-50 34-4 46-20 50-50z"/>';}
function candySVG(c1,c2){
  return '<circle cx="50" cy="50" r="26" fill="'+c1+'"/>'+
  '<path d="M50 24a26 26 0 0 1 0 52z" fill="'+c2+'"/>'+
  '<path fill="'+c1+'" d="M76 50l20-12v24z"/><path fill="'+c2+'" d="M24 50L4 38v24z"/>'+
  '<ellipse cx="42" cy="38" rx="7" ry="5" fill="#fff" opacity=".55" transform="rotate(-25 42 38)"/>';}
function houseSil(c){c=c||'#1A0E2C';
  let d='M0 200 L0 120 L40 120 L40 78 L70 50 L100 78 L100 120 L140 120 L140 92 L175 62 L210 92 L210 120 '+
        'L250 120 L250 70 L285 40 L320 70 L320 120 L360 120 L360 100 L360 200 Z';
  return '<path fill="'+c+'" d="'+d+'"/>';
}

/* =========================================================
   BUILD
   ========================================================= */
const R={};

/* ---------- shared: night sky factory ---------- */
function nightSky(parent,seed,opt){
  opt=opt||{};
  const sky=el('div','lay',
    'background:linear-gradient(180deg,#150A2C 0%,#2A1250 26%,#4A1D6B 52%,#7A2C6A 74%,#C7532F 92%,#F0863A 100%)',parent);
  // stars
  const st=el('div','lay','',parent); const r=rng(seed); const stars=[];
  for(let i=0;i<70;i++){
    const x=r()*W,y=r()*(H*0.55),s=1.5+r()*3.5;
    const d=el('div','abs','left:'+x.toFixed(0)+'px;top:'+y.toFixed(0)+'px;width:'+s.toFixed(1)+'px;height:'+s.toFixed(1)+
      'px;border-radius:50%;background:#FFF6D8;box-shadow:0 0 '+(s*3).toFixed(0)+'px #FFE9A8',st);
    stars.push({d:d,ph:r()*6.283,sp:1.4+r()*2.2});
  }
  // moon
  const moon=el('div','abs','left:'+(opt.mx!=null?opt.mx:718)+'px;top:'+(opt.my!=null?opt.my:196)+'px;width:250px;height:250px;border-radius:50%;'+
    'background:radial-gradient(circle at 36% 32%,#FFFDF0 0%,#FFF0BC 55%,#FCD98A 100%);'+
    'box-shadow:0 0 90px 34px rgba(255,226,150,.42),0 0 200px 90px rgba(255,190,110,.20)',parent);
  el('div','abs','left:56px;top:78px;width:44px;height:38px;border-radius:50%;background:rgba(226,190,120,.30)',moon);
  el('div','abs','left:140px;top:52px;width:30px;height:26px;border-radius:50%;background:rgba(226,190,120,.24)',moon);
  el('div','abs','left:104px;top:150px;width:52px;height:40px;border-radius:50%;background:rgba(226,190,120,.22)',moon);
  return {stars:stars,moon:moon,sky:sky};
}
function makeBats(parent,n,seed,scaleBase){
  const r=rng(seed),out=[];
  for(let i=0;i<n;i++){
    const s=(scaleBase||1)*(0.5+r()*0.75);
    const d=svg('0 0 100 60',batSVG('#160B26'),'width:'+(120*s).toFixed(0)+'px;height:'+(72*s).toFixed(0)+'px;left:0;top:0;opacity:.92',parent);
    out.push({d:d,y:120+r()*520,sp:120+r()*130,ph:r()*6.283,off:r()*W*1.6,amp:24+r()*40,s:s});
  }
  return out;
}

/* =========================================================
   SCENE 1 — OPENING
   ========================================================= */
const sc1=el('div','sc','',stage);
R.s1cam=el('div','lay','transform-origin:50% 52%',sc1);
const n1=nightSky(R.s1cam,7,{mx:700,my:180}); R.s1stars=n1.stars; R.s1moon=n1.moon;
// distant skyline
svg('0 0 360 200',houseSil('#1B0F2E'),'left:-40px;top:1090px;width:1180px;height:640px;opacity:.95',R.s1cam);
svg('0 0 360 200',houseSil('#120823'),'left:120px;top:1170px;width:1180px;height:640px;opacity:.9',R.s1cam);
// ground
el('div','abs','left:0;top:1560px;width:1080px;height:360px;background:linear-gradient(180deg,#3B1B44 0%,#25102E 100%)',R.s1cam);
el('div','abs','left:-100px;top:1500px;width:1280px;height:320px;background:radial-gradient(ellipse 46% 60% at 50% 60%,rgba(255,168,60,.55),rgba(255,140,40,0) 70%)',R.s1cam);
R.s1bats=makeBats(R.s1cam,5,21,1.0);
// pumpkins flanking
R.s1pk=[];
[[60,1520,1.25],[880,1560,1.05],[300,1660,0.72],[720,1690,0.62]].forEach(function(p,i){
  const g=el('div','abs','left:'+p[0]+'px;top:'+p[1]+'px;width:'+(240*p[2]).toFixed(0)+'px;height:'+(210*p[2]).toFixed(0)+'px;transform-origin:50% 90%',R.s1cam);
  el('div','abs','left:50%;top:52%;width:'+(420*p[2]).toFixed(0)+'px;height:'+(360*p[2]).toFixed(0)+'px;margin-left:'+(-210*p[2]).toFixed(0)+'px;margin-top:'+(-180*p[2]).toFixed(0)+
    'px;background:radial-gradient(circle,rgba(255,170,60,.55),rgba(255,150,40,0) 68%)',g);
  svg('0 0 120 100',pumpkinSVG(1),'inset:0',g);
  R.s1pk.push(g);
});
// character
R.s1glow=el('div','abs','left:540px;top:900px;width:1000px;height:1000px;margin-left:-500px;margin-top:-500px;'+
  'background:radial-gradient(circle,rgba(255,196,92,.60),rgba(255,150,40,.16) 45%,rgba(255,140,40,0) 70%)',R.s1cam);
R.s1shadow=el('div','abs','left:540px;top:1516px;width:520px;height:96px;margin-left:-260px;border-radius:50%;'+
  'background:radial-gradient(ellipse,rgba(20,6,32,.62),rgba(20,6,32,0) 70%)',R.s1cam);
R.s1chWrap=el('div','abs','left:540px;top:1520px;width:0;height:0',R.s1cam);
R.s1ch=el('img','ch','left:'+(-CHW*0.62/2)+'px;top:'+(-CHH*0.62)+'px;width:'+(CHW*0.62)+'px;'+
  'filter:drop-shadow(0 26px 30px rgba(40,10,60,.55))',R.s1chWrap);
R.s1ch.src=A.ch;
// confetti burst
R.s1conf=[];
(function(){const r=rng(99);
 for(let i=0;i<26;i++){
   const c=['#FFD24A','#FF7BB0','#5BD6C4','#FF9B3D','#B57BFF','#FFFFFF'][i%6];
   const d=el('div','abs','left:540px;top:1300px;width:'+(14+r()*16).toFixed(0)+'px;height:'+(14+r()*10).toFixed(0)+
     'px;background:'+c+';border-radius:'+(r()<.5?'50%':'4px'),R.s1cam);
   R.s1conf.push({d:d,a:r()*6.283,v:520+r()*620,rot:r()*720-360,sz:1});
 }})();

/* =========================================================
   SCENE 2 — 9-UP GRID
   ========================================================= */
const sc2=el('div','sc','background:#0E0620',stage);
R.s2cam=el('div','lay','transform-origin:50% 50%',sc2);
const GX=[24,376,728], GY=[24,660,1296], GW=328, GH=612;
R.tiles=[];
const TILEBG=[
 'linear-gradient(180deg,#43195E,#8E3B33)',
 'linear-gradient(180deg,#2A1250,#6A2A72)',
 'linear-gradient(180deg,#123A3D,#1E6A63)',
 'linear-gradient(180deg,#3A1030,#8A3A16)',
 'linear-gradient(180deg,#2B1150,#7C2E68)',
 'linear-gradient(180deg,#4A1A22,#9A4A18)',
 'linear-gradient(180deg,#1D1C5E,#4E3CA6)',
 'linear-gradient(180deg,#2A1440,#5E2450)',
 'linear-gradient(180deg,#1A0E38,#4B2170)'];
R.s2glow=el('div','abs','left:540px;top:960px;width:1900px;height:1900px;margin-left:-950px;margin-top:-950px;'+
  'background:radial-gradient(circle,rgba(255,206,124,.95),rgba(255,150,60,.45) 26%,rgba(120,40,120,.18) 52%,rgba(20,6,32,0) 72%);opacity:0',sc2);
for(let i=0;i<9;i++){
  const c=i%3, rw=(i/3)|0;
  const t=el('div','abs','left:'+GX[c]+'px;top:'+GY[rw]+'px;width:'+GW+'px;height:'+GH+'px;border-radius:26px;'+
    'overflow:hidden;background:'+TILEBG[i]+';transform-origin:50% 50%;box-shadow:0 18px 40px rgba(0,0,0,.45)',R.s2cam);
  const inner=el('div','lay','',t);
  R.tiles.push({d:t,in:inner,i:i});
}
function tchar(par,scale,left,top,extra){
  const im=el('img','abs','left:'+left+'px;top:'+top+'px;width:'+(CHW*scale).toFixed(0)+'px;'+(extra||''),par);
  im.src=A.ch;return im;}
// tile 0: full body over pumpkins
(function(p){el('div','lay','background:radial-gradient(circle at 50% 78%,rgba(255,176,64,.55),rgba(0,0,0,0) 62%)',p);
 svg('0 0 120 100',pumpkinSVG(1),'left:-30px;top:430px;width:190px;height:165px',p);
 svg('0 0 120 100',pumpkinSVG(1),'left:180px;top:470px;width:150px;height:130px',p);
 R.t0ch=tchar(p,0.34,15,120,'filter:drop-shadow(0 14px 18px rgba(30,6,44,.6))');
})(R.tiles[0].in);
// tile 1: face close-up
(function(p){el('div','lay','background:radial-gradient(circle at 50% 40%,rgba(255,120,190,.30),rgba(0,0,0,0) 65%)',p);
 R.t1ch=tchar(p,0.86,-330,-120,'filter:drop-shadow(0 10px 16px rgba(20,4,40,.5))');
 for(let k=0;k<7;k++){svg('0 0 100 100',sparkSVG('#FFE9A8'),'left:'+(20+k*46)+'px;top:'+(40+((k*77)%420))+'px;width:'+(18+k*3)+'px;height:'+(18+k*3)+'px;opacity:.85',p);}
})(R.tiles[1].in);
// tile 2: pom-pom close-up
(function(p){el('div','lay','background:radial-gradient(circle at 60% 45%,rgba(90,230,210,.35),rgba(0,0,0,0) 66%)',p);
 R.t2ch=tchar(p,1.28,-980,-330,'filter:drop-shadow(0 10px 16px rgba(4,40,40,.5))');
})(R.tiles[2].in);
// tile 3: big jack-o-lantern
(function(p){R.t3glow=el('div','abs','left:50%;top:56%;width:520px;height:520px;margin-left:-260px;margin-top:-260px;'+
   'background:radial-gradient(circle,rgba(255,186,74,.8),rgba(255,150,40,0) 66%)',p);
 R.t3pk=svg('0 0 120 100',pumpkinSVG(1),'left:14px;top:170px;width:300px;height:262px;transform-origin:50% 90%',p);
 for(let k=0;k<5;k++){el('div','abs','left:'+(30+k*62)+'px;top:'+(60+(k%3)*40)+'px;width:8px;height:8px;border-radius:50%;background:#FFDD8A;box-shadow:0 0 16px #FFC15A',p);}
})(R.tiles[3].in);
// tile 4 (CENTER): character jumping + confetti
(function(p){el('div','lay','background:radial-gradient(circle at 50% 60%,rgba(255,160,80,.42),rgba(0,0,0,0) 70%)',p);
 R.t4ch=tchar(p,0.40,-6,140,'filter:drop-shadow(0 16px 22px rgba(30,6,44,.6))');
 R.t4conf=[];const r=rng(5);
 for(let k=0;k<16;k++){const c=['#FFD24A','#FF7BB0','#5BD6C4','#FFFFFF','#FF9B3D'][k%5];
   const d=el('div','abs','left:'+(r()*GW).toFixed(0)+'px;top:0;width:12px;height:12px;border-radius:'+(k%2?'50%':'3px')+';background:'+c,p);
   R.t4conf.push({d:d,y0:-r()*GH,sp:150+r()*180,ph:r()*6.283});}
})(R.tiles[4].in);
// tile 5: candy rain
(function(p){R.t5c=[];const r=rng(11);
 for(let k=0;k<18;k++){
  const s=42+r()*40;
  const d=svg('0 0 100 100',candySVG(['#FF6FA5','#FFC94A','#7BD8E8','#B98BFF'][k%4],'#FFFFFF'),
   'left:'+(r()*(GW-s)).toFixed(0)+'px;top:0;width:'+s.toFixed(0)+'px;height:'+s.toFixed(0)+'px',p);
  R.t5c.push({d:d,y0:-r()*GH,sp:130+r()*160,ph:r()*6.283});}
})(R.tiles[5].in);
// tile 6: moon + bats
(function(p){el('div','abs','left:70px;top:120px;width:190px;height:190px;border-radius:50%;'+
  'background:radial-gradient(circle at 36% 32%,#FFFDF0,#FCD98A);box-shadow:0 0 60px 20px rgba(255,226,150,.4)',p);
 R.t6b=makeBats(p,4,33,0.62);
})(R.tiles[6].in);
// tile 7: cobbled path receding with pumpkins
(function(p){el('div','abs','left:-60px;top:250px;width:448px;height:362px;background:'+
  'radial-gradient(ellipse 60% 100% at 50% 100%,rgba(255,170,60,.42),rgba(0,0,0,0) 70%),'+
  'linear-gradient(180deg,#2C1436,#4A2242)',p);
 for(let k=0;k<4;k++){const s=64+k*38;
  svg('0 0 120 100',pumpkinSVG(1),'left:'+(k%2?GW-s-6:6)+'px;top:'+(300+k*72)+'px;width:'+s+'px;height:'+(s*0.86)+'px',p);}
 R.t7ch=tchar(p,0.24,90,150,'opacity:.98;filter:drop-shadow(0 10px 14px rgba(20,4,40,.6))');
})(R.tiles[7].in);
// tile 8: ghost + cat
(function(p){el('div','lay','background:radial-gradient(circle at 50% 55%,rgba(150,110,255,.35),rgba(0,0,0,0) 68%)',p);
 R.t8g=svg('0 0 100 100',ghostSVG(),'left:40px;top:150px;width:150px;height:150px',p);
 R.t8c=svg('0 0 100 110',catSVG(),'left:170px;top:330px;width:140px;height:154px',p);
 for(let k=0;k<8;k++){svg('0 0 100 100',sparkSVG('#E8D6FF'),'left:'+(18+k*40)+'px;top:'+(60+((k*97)%430))+'px;width:'+(14+k*2)+'px;height:'+(14+k*2)+'px;opacity:.8',p);}
})(R.tiles[8].in);

/* =========================================================
   SCENE 3 — MAIN HALLOWEEN STREET
   ========================================================= */
const sc3=el('div','sc','',stage);
R.s3cam=el('div','lay','transform-origin:50% 50%',sc3);
const n3=nightSky(R.s3cam,4,{mx:660,my:150}); R.s3stars=n3.stars;
R.s3bats=makeBats(R.s3cam,6,66,1.05);
// parallax tiled layers
function tiled(parent,top,height,speedKey,build,extraCss){
  const l=el('div','abs','left:0;top:'+top+'px;width:'+W+'px;height:'+height+'px;'+(extraCss||''),parent);
  const strip=el('div','abs','left:0;top:0;width:'+(W*3)+'px;height:'+height+'px',l);
  for(let i=0;i<3;i++){const seg=el('div','abs','left:'+(i*W)+'px;top:0;width:'+W+'px;height:'+height+'px',strip);build(seg,i);}
  return {strip:strip,sp:speedKey};
}
R.p1=tiled(R.s3cam,980,420,18,function(s){
  svg('0 0 360 200',houseSil('#1D1030'),'left:0;top:0;width:1080px;height:420px',s);

/* =========================================================
   RENDER
   ========================================================= */
function show(node,on){node.style.display=on?'block':'none';}
function tr(node,s){node.style.transform=s;}

function render(t){
  t=Math.max(0,Math.min(DUR,t));
  const inS1=t<S1[1], inS2=t>=S2[0]&&t<S2[1], inS3=t>=S3[0]&&t<S3[1],
        inS4=t>=S4[0]&&t<S4[1], inS5=t>=S5[0];
  show(sc1,inS1); show(sc2,inS2); show(sc3,inS3||inS4&&t<S4[0]+0.75);
  /* ---------- S1 ---------- */
  if(inS1){
    const u=t-S1[0];
    tr(R.s1cam,'scale('+(1.0+0.075*eIO(pr(u,0,4.6))).toFixed(4)+')');
    R.s1stars.forEach(function(s,i){s.d.style.opacity=(0.35+0.65*Math.abs(Math.sin(u*s.sp+s.ph))).toFixed(3);});
    R.s1bats.forEach(function(b){
      const x=((b.off+u*b.sp)%(W+400))-200;
      tr(b.d,'translate('+x.toFixed(1)+'px,'+(b.y+Math.sin(u*2.2+b.ph)*b.amp).toFixed(1)+'px) scaleX('+(0.85+0.25*Math.sin(u*9+b.ph)).toFixed(3)+')');
    });
    R.s1pk.forEach(function(g,i){
      const s=1+0.045*Math.sin(u*3.1+i*1.3);
      tr(g,'scale('+s.toFixed(4)+','+(2-s).toFixed(4)+')');
    });
    // character entrance + idle
    const dropP=pr(u,0.10,0.80);
    let y = lerp(-1500,0,eOut4(dropP));
    let sx=1, sy=1, rot=0;
    const land=pr(u,0.78,1.10);
    if(dropP>=1){
      sx=lerp(1.26,1,eElas(land)); sy=lerp(0.76,1,eElas(land));
      const idle=u-1.0;
      if(idle>0){
        const b=Math.abs(Math.sin(idle*Math.PI/0.62));
        y=-58*b;
        rot=4.4*Math.sin(idle*Math.PI*2/1.24);
        sx*=1+0.03*Math.sin(idle*Math.PI*2/0.62+1.2);
        sy*=1-0.03*Math.sin(idle*Math.PI*2/0.62+1.2);
      }
    } else { rot=lerp(-14,0,eOut(dropP)); }
    const chS=1;
    tr(R.s1chWrap,'translateY('+y.toFixed(1)+'px) rotate('+rot.toFixed(2)+'deg) scale('+(sx*chS).toFixed(4)+','+(sy*chS).toFixed(4)+')');
    R.s1chWrap.style.opacity=dropP>0?1:0;
    const sh=clamp(1-(-y)/460);
    tr(R.s1shadow,'scale('+(0.55+0.6*sh).toFixed(3)+','+(0.6+0.5*sh).toFixed(3)+')');
    R.s1shadow.style.opacity=(0.35+0.5*sh).toFixed(3);
    R.s1glow.style.opacity=(0.55+0.25*Math.sin(u*2.6)).toFixed(3);
    tr(R.s1glow,'translateY('+(y*0.5).toFixed(1)+'px) scale('+(1+0.05*Math.sin(u*2.6)).toFixed(3)+')');
    // confetti burst on landing
    const cu=u-0.86;
    R.s1conf.forEach(function(c,i){
      if(cu<0||cu>1.9){c.d.style.opacity=0;return;}
      const vx=Math.cos(c.a)*c.v, vy=Math.sin(c.a)*c.v-330;
      const x=vx*cu, yy=vy*cu+520*cu*cu;
      c.d.style.opacity=clamp(1-cu/1.7).toFixed(3);
      tr(c.d,'translate('+x.toFixed(1)+'px,'+yy.toFixed(1)+'px) rotate('+(c.rot*cu).toFixed(1)+'deg)');
    });
  }
  /* ---------- S2 ---------- */
  if(inS2){
    const u=t-S2[0];
    const ORDER=[4,3,5,1,7,0,2,6,8];
    const OUTQ =[0,2,6,8,1,3,5,7,4];
    const collapse=pr(u,3.25,4.58);
    tr(R.s2cam,'scale('+lerp(1.0,1.30,eIn(collapse)).toFixed(4)+') rotate('+(collapse*1.5).toFixed(2)+'deg)');
    R.tiles.forEach(function(tl,i){
      const ord=ORDER.indexOf(i), din=0.06+ord*0.075;
      const p=pr(u,din,din+0.42);
      const oq=OUTQ.indexOf(i), dout=3.25+oq*0.062;
      const q=pr(u,dout,dout+0.62);
      const cx=(GX[i%3]+GW/2)-W/2, cy=(GY[(i/3)|0]+GH/2)-H/2;
      const dirx=cx*0.0032, diry=cy*0.0022;
      const s=lerp(0.55,1,eBack(p)) * lerp(1,1.9,eIn(q));
      const px=lerp(0,dirx*520,eIn(q)), py=lerp(0,diry*520,eIn(q));
      const wob=Math.sin(u*2.4+i*0.9)*3;
      tl.d.style.opacity=(p*(1-eIn(q))).toFixed(3);
      tr(tl.d,'translate('+px.toFixed(1)+'px,'+(py+wob).toFixed(1)+'px) scale('+s.toFixed(4)+') rotate('+(lerp(-7,0,eBack(p))+q*6*Math.sign(dirx||1)).toFixed(2)+'deg)');
    });
    R.s2glow.style.opacity=(pr(u,3.25,4.58)*0.92).toFixed(3);
    tr(R.s2glow,'scale('+lerp(0.25,1.15,eIn(pr(u,3.25,4.58))).toFixed(3)+')');
    // tile internals
    tr(R.t0ch,'translateY('+(-16*Math.abs(Math.sin(u*3.0))).toFixed(1)+'px) rotate('+(3*Math.sin(u*3.0)).toFixed(2)+'deg)');
    tr(R.t1ch,'translate('+(8*Math.sin(u*1.6)).toFixed(1)+'px,'+(-10*Math.abs(Math.sin(u*2.2))).toFixed(1)+'px) scale('+(1+0.02*Math.sin(u*1.7)).toFixed(4)+')');
    tr(R.t2ch,'rotate('+(6*Math.sin(u*4.2)).toFixed(2)+'deg)');
    R.t3glow.style.opacity=(0.7+0.3*Math.sin(u*5.4)).toFixed(3);
    tr(R.t3pk,'scale('+(1+0.05*Math.sin(u*3.4)).toFixed(4)+','+(1-0.05*Math.sin(u*3.4)).toFixed(4)+')');
    tr(R.t4ch,'translateY('+(-40*Math.abs(Math.sin(u*3.6))).toFixed(1)+'px) rotate('+(5*Math.sin(u*3.6)).toFixed(2)+'deg)');
    R.t4conf.forEach(function(c){const y=((c.y0+u*c.sp)%(GH+120))-60;
      tr(c.d,'translate('+(Math.sin(u*2+c.ph)*16).toFixed(1)+'px,'+y.toFixed(1)+'px) rotate('+(u*220+c.ph*60).toFixed(1)+'deg)');});
    R.t5c.forEach(function(c){const y=((c.y0+u*c.sp)%(GH+140))-70;
      tr(c.d,'translate('+(Math.sin(u*1.6+c.ph)*22).toFixed(1)+'px,'+y.toFixed(1)+'px) rotate('+(u*140+c.ph*80).toFixed(1)+'deg)');});
    R.t6b.forEach(function(b){const x=((b.off*0.3+u*b.sp*0.42)%(GW+180))-90;
      tr(b.d,'translate('+x.toFixed(1)+'px,'+(60+ (b.y%420) +Math.sin(u*2.6+b.ph)*20).toFixed(1)+'px) scaleX('+(0.8+0.3*Math.sin(u*10+b.ph)).toFixed(3)+')');});
    tr(R.t7ch,'translateY('+(-22*Math.abs(Math.sin(u*2.6+1))).toFixed(1)+'px)');
    tr(R.t8g,'translate('+(14*Math.sin(u*1.4)).toFixed(1)+'px,'+(-16*Math.sin(u*1.9)).toFixed(1)+'px)');
    tr(R.t8c,'translateY('+(-8*Math.abs(Math.sin(u*2.1))).toFixed(1)+'px)');
    // grid caption
    const gp=pr(u,0.55,0.95), gq=1-pr(u,2.85,3.20);
    R.txGrid.d.style.opacity=(gp*gq).toFixed(3);
    R.gridScrim.style.opacity=(gp*gq*0.95).toFixed(3);
    R.txGrid.sp.forEach(function(s,i){
      const q=pr(u,0.55+i*0.028,0.55+i*0.028+0.34);
      tr(s,'translateY('+lerp(46,0,eBack(q)).toFixed(1)+'px) scale('+lerp(0.4,1,eBack(q)).toFixed(3)+')');
    });
    R.txGrid.d.style.top='904px';
  } else { R.txGrid.d.style.opacity=0; R.gridScrim.style.opacity=0; }
  /* ---------- S3 ---------- */
  const s3active = inS3 || (t>=S4[0]&&t<S4[0]+0.75);
  if(s3active){
    const u=t-S3[0];
    const scroll=u;
    const camK=pr(t,S4[0],S4[0]+0.75);
    tr(R.s3cam,'scale('+(1.0+0.03*Math.sin(u*0.5)+0.22*eIn(camK)).toFixed(4)+')');
    R.s3stars.forEach(function(s){s.d.style.opacity=(0.35+0.65*Math.abs(Math.sin(u*s.sp+s.ph))).toFixed(3);});
    R.s3bats.forEach(function(b){
      const x=((b.off+u*b.sp*0.9)%(W+420))-210;
      tr(b.d,'translate('+x.toFixed(1)+'px,'+(b.y*0.7+Math.sin(u*2.0+b.ph)*b.amp).toFixed(1)+'px) scaleX('+(0.85+0.25*Math.sin(u*8.5+b.ph)).toFixed(3)+')');
    });
    [R.p1,R.p2,R.p3,R.p4,R.p5].forEach(function(L){
      tr(L.strip,'translateX('+(-((scroll*L.sp)%W)).toFixed(1)+'px)');
    });
    R.s3candy.forEach(function(c){
      const y=((c.y0+u*c.sp)%(H+300))-150;
      tr(c.d,'translate('+(Math.sin(u*1.3+c.ph)*c.sw).toFixed(1)+'px,'+y.toFixed(1)+'px) rotate('+(u*120+c.ph*90).toFixed(1)+'deg)');
      c.d.style.opacity=(y>H-260?clamp((H-y)/260):1).toFixed(3);
    });
    // hop cycle
    const HOP=0.60;
    const walkEnd=4.55;
    const ph=(u%HOP)/HOP;
    const air=u<walkEnd? Math.sin(ph*Math.PI) : 0;
    let cy=-210*air, crot=7*Math.sin(u*Math.PI*2/(HOP*2)), csx=1, csy=1;
    const lp=clamp(1-Math.abs(ph-0)/0.16)+clamp(1-Math.abs(ph-1)/0.16);
    if(u<walkEnd){ csx=1+0.16*lp; csy=1-0.16*lp; }
    let cxo=0;
    if(u>=walkEnd){
      const q=pr(u,walkEnd,walkEnd+0.85);
      cxo=lerp(0,-352,eIO(q));
      const idle=u-walkEnd;
      cy=-56*Math.abs(Math.sin(idle*Math.PI/0.55));
      crot=5.4*Math.sin(idle*Math.PI*2/1.1);
      csx=1+0.035*Math.sin(idle*Math.PI*2/0.55+1.2); csy=2-csx;
      // small extra cheer scale
      csx*=lerp(1,1.06,pr(u,5.4,5.9)); csy*=lerp(1,1.06,pr(u,5.4,5.9));
      const shrink=lerp(1,0.70,eIO(pr(t,13.50,14.55)));
      csx*=shrink; csy*=shrink;
    }
    tr(R.s3chWrap,'translate('+cxo.toFixed(1)+'px,'+cy.toFixed(1)+'px) rotate('+crot.toFixed(2)+'deg) scale('+csx.toFixed(4)+','+csy.toFixed(4)+')');
    const shp=clamp(1-(-cy)/430);
    const shShrink=lerp(1,0.70,eIO(pr(t,13.50,14.55)));
    tr(R.s3shadow,'translateX('+cxo.toFixed(1)+'px) scale('+((0.5+0.6*shp)*shShrink).toFixed(3)+','+((0.55+0.5*shp)*shShrink).toFixed(3)+')');
    R.s3shadow.style.opacity=(0.3+0.5*shp).toFixed(3);
    // pom sparkles
    R.s3sp.forEach(function(s,i){
      const life=((u*1.25+s.ph)%1);
      const ang=s.a+life*1.4;
      const rad=s.rad*(0.28+life*0.95);
      const x=540+cxo+Math.cos(ang)*rad*0.85;
      const y=1660+cy-620+Math.sin(ang)*rad*0.55;
      s.d.style.opacity=(clamp(Math.sin(life*Math.PI))*0.95).toFixed(3);
      tr(s.d,'translate('+(x-50).toFixed(1)+'px,'+(y-50).toFixed(1)+'px) scale('+(0.4+life*0.9).toFixed(3)+') rotate('+(life*180).toFixed(1)+'deg)');
    });
    R.s3dark.style.opacity=(pr(u,4.5,5.6)*0.9).toFixed(3);
  }
  /* ---------- BOTTLE STAGE ---------- */
  (function(){
    // life: appears at 13.7s (S3 reveal beat), stays through S5
    const T_RISE=13.70, T_WIPE=S4[0], T_SWAP=S4[0]+0.85, T_SET=S4[0]+2.30;
    const alive = t>=T_RISE-0.05;
    show(bstage,alive);
    if(!alive) return;
    const rise=pr(t,T_RISE,T_RISE+1.05);
    // vertical placement: halloween scene y -> final white-scene y
    const yHall=lerp(1790,676,eOut4(rise));
    const yProd=470;
    const settle=pr(t,T_SWAP,T_SET);
    const y=lerp(yHall,yProd,eIO(pr(t,T_WIPE+0.10,T_SWAP+0.55)));
    const sIn=lerp(0.52,0.90,eOut4(rise));
    const sFin=lerp(1.0,1.200,eIO(pr(t,T_WIPE+0.10,T_SWAP+0.55)));
    const breathe = t<T_WIPE ? 1+0.012*Math.sin((t-T_RISE)*2.4) : 1;
    const pop = 1+0.045*(1-eOut(pr(t,T_SWAP,T_SWAP+0.7)));
    const sc = sIn*sFin*breathe*(t>=T_SWAP?pop:1);
    R.bwrap.style.top=y.toFixed(1)+'px';
    R.bwrap.style.transformOrigin='50% '+(BH*0.5).toFixed(0)+'px';
    tr(R.bwrap,'scale('+sc.toFixed(4)+') rotate('+(t<T_WIPE?(1.2*Math.sin((t-T_RISE)*1.6)):0).toFixed(2)+'deg)');
    R.bwrap.style.opacity=rise>0?1:0;
    // crossfade halloween -> product (geometry identical, pixels untouched)
    const fade=pr(t,T_SWAP,T_SWAP+0.85);
    R.bprod.style.opacity=fade.toFixed(3);
    R.bhall.style.opacity=(1-fade).toFixed(3);
    R.bhall.style.filter = t<T_WIPE ? 'drop-shadow(0 40px 54px rgba(20,4,40,.55))' : 'none';
    // rays & glow
    const rayA = pr(t,T_RISE+0.15,T_RISE+0.9)*(1-pr(t,T_WIPE+0.15,T_WIPE+0.6));
    R.brays.style.opacity=(rayA*0.55).toFixed(3);
    R.brays.style.top=(y+BH*0.42-750).toFixed(1)+'px';
    tr(R.brays,'rotate('+((t-T_RISE)*11).toFixed(2)+'deg) scale('+lerp(0.6,1.05,eOut(rise)).toFixed(3)+')');
    const glowA = rayA*0.5 + pr(t,T_WIPE-0.35,T_WIPE+0.25)*0.9*(1-pr(t,T_SWAP,T_SWAP+0.50));
    R.bglow.style.opacity=clamp(glowA).toFixed(3);
    R.bglow.style.top=(y+BH*0.40-600).toFixed(1)+'px';
    tr(R.bglow,'scale('+lerp(0.7,1.5,pr(t,T_WIPE-0.35,T_WIPE+0.35)).toFixed(3)+')');
    // sparkle ring burst at reveal
    R.bsp.forEach(function(s,i){
      const b=pr(t,T_SWAP+0.02+ (i%5)*0.02, T_SWAP+1.15+(i%5)*0.02);
      const orbit=t>T_SWAP+1.0;
      let op=0,x=0,yy=0,sc2=1;
      if(b>0&&b<1){ op=Math.sin(b*Math.PI); const r=s.rad*eOut(b);
        x=540+Math.cos(s.a)*r; yy=y+BH*0.45+Math.sin(s.a)*r*0.9; sc2=0.4+b*1.1; }
      else if(orbit){ const ang=s.a+(t-T_SWAP)*0.5; const r=s.rad*0.92;
        op=0.30+0.30*Math.sin((t*1.6)+s.a*3); x=540+Math.cos(ang)*r; yy=y+BH*0.45+Math.sin(ang)*r*0.85; sc2=0.55; }
      s.d.style.opacity=clamp(op).toFixed(3);
      tr(s.d,'translate('+(x-s.s/2).toFixed(1)+'px,'+(yy-s.s/2).toFixed(1)+'px) scale('+sc2.toFixed(3)+') rotate('+((t*40)+i*30).toFixed(1)+'deg)');
    });
  })();
  /* ---------- S5 white scene ---------- */
  (function(){
    const wp=pr(t,S4[0]+0.30,S4[0]+0.72);
    sc5.style.opacity=wp.toFixed(3);
    show(sc5,wp>0); show(R.s5fg,wp>0);
    if(wp<=0) return;
    const u=t-(S4[0]+0.72);
    R.s5name.style.opacity=pr(t,18.18,18.78).toFixed(3);
    tr(R.s5name,'translateY('+lerp(34,0,eOut(pr(t,18.18,18.88))).toFixed(1)+'px)');
    R.s5top.style.opacity=pr(t,18.02,18.62).toFixed(3);
    tr(R.s5top,'translateY('+lerp(-26,0,eOut(pr(t,18.02,18.72))).toFixed(1)+'px)');
    R.s5tag.style.opacity=pr(t,18.52,19.12).toFixed(3);
    tr(R.s5tag,'translateY('+lerp(22,0,eOut(pr(t,18.52,19.22))).toFixed(1)+'px)');
    const lw=lerp(0,520,eOut(pr(t,18.70,19.40)));
    R.s5line.style.width=lw.toFixed(0)+'px'; R.s5line.style.marginLeft=(-lw/2).toFixed(0)+'px';
    R.s5line.style.opacity=pr(t,18.70,19.10).toFixed(3);
    R.s5foot.style.opacity=pr(t,19.85,20.45).toFixed(3);
    tr(R.s5foot,'translateY('+lerp(20,0,eOut(pr(t,19.85,20.55))).toFixed(1)+'px)');
    // small character wave
    const cp=pr(t,19.45,20.05);
    const idle=Math.max(0,t-19.9);
    const bob=-14*Math.abs(Math.sin(idle*Math.PI/0.72));
    const rot=lerp(-16,0,eBack(cp))+4.5*Math.sin(idle*Math.PI*2/1.44);
    R.s5chWrap.style.opacity=cp.toFixed(3);
    tr(R.s5chWrap,'translate('+lerp(-190,0,eBack(cp)).toFixed(1)+'px,'+bob.toFixed(1)+'px) rotate('+rot.toFixed(2)+'deg) scale('+lerp(0.6,1,eBack(cp)).toFixed(3)+')');
    R.s5deco.forEach(function(d,i){
      const q=pr(t,19.30+i*0.05,19.90+i*0.05);
      d.style.opacity=(q*(0.55+0.45*Math.abs(Math.sin(t*1.4+i)))).toFixed(3);
      tr(d,'translateY('+(Math.sin(t*1.1+i*0.7)*7).toFixed(1)+'px) scale('+lerp(0.5,1,eBack(q)).toFixed(3)+')');
    });
  })();
  /* ---------- TEXT overlays ---------- */
  function beat(o,a,b,c,d,y,baseY){
    const inn=pr(t,a,b), out=pr(t,c,d);
    o.d.style.opacity=(inn*(1-out)).toFixed(3);
    o.d.style.top=(baseY)+'px';
    o.sp.forEach(function(s,i){
      const q=pr(t,a+i*0.026,a+i*0.026+0.32);
      tr(s,'translateY('+lerp(54,0,eBack(q)).toFixed(1)+'px) scale('+lerp(0.35,1,eBack(q)).toFixed(3)+') rotate('+lerp(-12,0,eBack(q)).toFixed(2)+'deg)');
    });
    tr(o.d,'scale('+lerp(1,1.14,eIn(out)).toFixed(3)+')');
  }
  beat(R.tx1 ,1.05,1.60,3.95,4.30,0,1160);
  beat(R.tx1b,0.55,1.10,3.80,4.10,0,1010);
  beat(R.tx2 ,9.75,10.35,11.85,12.15,0,300);
  beat(R.tx3 ,12.45,13.05,15.05,15.35,0,300);
  beat(R.tx4 ,14.95,15.45,16.25,16.50,0,300);
  /* ---------- overlays ---------- */
  const dark = inS1||inS2||s3active || (t>=S4[0]&&t<S4[0]+0.6);
  R.vig.style.opacity = dark? (1-pr(t,S4[0],S4[0]+0.5)).toFixed(3) : 0;
  R.grain.style.opacity = dark? (0.055*(1-pr(t,S4[0],S4[0]+0.5))).toFixed(4) : 0;
  tr(R.grain,'translate('+((t*137)%180-90).toFixed(0)+'px,'+((t*211)%180-90).toFixed(0)+'px)');
  // flashes / white wipe
  let fl=0;
  fl=Math.max(fl, 1-pr(t,0.00,0.34));                       // open from white
  fl=Math.max(fl, (1-Math.abs(t-S2[0])/0.16)*0.95);          // cut into grid
  fl=Math.max(fl, (1-Math.abs(t-S3[0])/0.17)*1.0);           // cut into street
  // reveal wipe: bloom to white
  const wipe=pr(t,S4[0]+0.12,S4[0]+0.52);
  fl=Math.max(fl, wipe*(1-pr(t,S4[0]+0.52,S4[0]+0.95)));
  R.flash.style.opacity=clamp(fl).toFixed(3);
  // fade out tail
  if(t>DUR-0.35){ /* keep product clean: no fade to black */ }
}
window.render=render;
window.__DUR=DUR;
render(0);
window.__ready=true;
</script>
