<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>puppet test</title>
<style>*{margin:0;padding:0}html,body{width:1600px;height:640px;overflow:hidden;background:#1BBE1B}
canvas{display:block}</style></head>
<body>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { loadPuppet, buildPuppet, posePuppet, faceCamera } from './lib/puppet.js';

const W=1600,H=640;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,preserveDrawingBuffer:true});
renderer.setSize(W,H); renderer.setPixelRatio(1);
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x1BBE1B);
const camera=new THREE.PerspectiveCamera(30,W/H,0.1,100);
camera.position.set(0,1.8,17.0); camera.lookAt(0,1.8,0);

const A=await loadPuppet();
const POSES=[];
for(let i=0;i<8;i++){
  const ang=i*0.42;
  POSES.push({expr:'stand', armR:ang, armL:-ang*0.35, label:''+ang.toFixed(2)});
}
const rigs=[];
for(let i=0;i<POSES.length;i++){
  const r=buildPuppet(A); scene.add(r);
  r.position.set(-9.8+i*2.8,0,0);
  posePuppet(r,POSES[i]); faceCamera(r,camera);
  rigs.push(r);
}
window.__ready=true;
window.render=function(){ renderer.render(scene,camera); };
window.render();
</script></body></html>
